name: keepwarm

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements-keepwarm.txt
      - run: playwright install --with-deps chromium
      - run: python tools/keepwarm.py
        env:
          APP_URL: ${{ vars.APP_URL }}
